    <title>Juego: Encuentra las Diferencias</title>

<body>

    <h1>Encuentra las 2 Diferencias 🔍</h1>
    <p>Nivel: Fácil. Compara ambos lados de la imagen.</p>
    <div class="contador">Diferencias encontradas: <span id="encontradas">0</span> / 2</div>

    <!-- Contenedor del juego -->
    <div class="juego-container">
        <img src="../assets/img de diferencias/elefantante813x610.png" alt="Imagen de diferencias" class="imagen-juego">
        <!-- DEFINICIÓN DE LAS DIFERENCIAS (Usa porcentajes para que sea responsivo) -->
        <!-- Nota: Estos porcentajes son de ejemplo para la imagen de arriba -->
        

                    <!-- Zona de la Planta (Lado derecho) -->
        <div class="diferencia" style="top: 70%; left: 52%; width: 14%; height: 21%;"></div>

        <!-- Zona del Balde Gris (Extremo derecho) -->
        <div class="diferencia" style="top: 73%; left: 81%; width: 12%; height: 18%;"></div>

    </div>
