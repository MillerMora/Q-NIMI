<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego de Memoria - Encuentra las Parejas</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f7f9fc;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #2c3e50;
        }

        /* Cuadrícula del juego: 4 columnas para nivel fácil */
        .tablero {
            display: grid;
            grid-template-columns: repeat(4, 80px);
            gap: 15px;
            justify-content: center;
            margin: 20px auto;
            max-width: 400px;
        }

        /* Estilo base de cada tarjeta */
        .tarjeta {
            width: 80px;
            height: 80px;
            background-color: #34495e;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            cursor: pointer;
            color: transparent; /* Oculta el emoji al inicio */
            transition: background-color 0.3s, transform 0.2s;
            user-select: none;
        }

        /* Efecto al pasar el mouse */
        .tarjeta:hover {
            transform: scale(1.05);
        }

        /* Cuando la tarjeta se voltea o ya se encontró su pareja */
        .tarjeta.volteada, .tarjeta.emparejada {
            background-color: #ffffff;
            border: 2px solid #3498db;
            color: initial; /* Muestra el emoji */
            pointer-events: none; /* Evita volver a hacer clic en la misma */
        }

        /* Estilo visual cuando se encuentra un par correcto */
        .tarjeta.emparejada {
            border-color: #2ecc71;
            background-color: #e8f8f5;
        }

        .mensaje {
            display: none;
            font-size: 1.5rem;
            color: #27ae60;
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>Juego de Memoria 🧠🐾</h1>
    <p>Encuentra las parejas de animales.</p>

    <div class="tablero" id="tablero"></div>

    <div class="mensaje" id="mensaje-victoria">¡Excelente memoria! Has encontrado todas las parejas. 🎉</div>

    
</body>
</html>
    <script src="/Frontend/views/js/memoria.js" defer></script>
</body>
</html>
